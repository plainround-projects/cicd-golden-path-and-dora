<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">One service, from command to metrics</title>
<desc id="d">A numbered run of goldenpath new-service orders team-orders --release across five lanes: Product team, Generator and audit, Pipeline and deploy, Collector and Event store. The generator validates the names (1), renders the template (2) and audits the result (3). Any finding stops the command and nothing is published (3x). Otherwise it publishes the repo and registers the catalog entry (4), posts the commit events (5) and runs the pipeline to a deploy event (6). The stopwatch prints the time from the command to production, orders 83 s (7). An unsigned image is refused and recorded as a failed event (8). The metrics are computed from the stored events (9).</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="899" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="898" rx="16"/>
<text class="title" x="48" y="68">One service, from command to metrics</text>
<text class="caption" x="48" y="100">One service from command to metrics. Amber rows: a finding stops the command, an unsigned image is refused.</text>
<rect class="actor" x="385" y="128" width="150" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">Product team</text>
<rect class="svc" x="550" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="610" y="148" text-anchor="middle">Generator</text>
<text class="lane" x="610" y="168" text-anchor="middle">and audit</text>
<rect class="svc" x="705" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="770" y="148" text-anchor="middle">Pipeline</text>
<text class="lane" x="770" y="168" text-anchor="middle">and deploy</text>
<rect class="svc" x="870" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="930" y="158" text-anchor="middle">Collector</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="148" text-anchor="middle">Event</text>
<text class="lane" x="1088" y="168" text-anchor="middle">store</text>
<path class="hair" d="M460 176V808M610 176V680M770 176V744M930 176V744M1088 176V808"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Owner and name are checked</text>
<text class="sub" x="96" y="232">a person as owner stops here</text>
<rect class="slot" x="604" y="198" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="221">catalog rules</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">The template is rendered</text>
<text class="sub" x="96" y="296">four placeholders replaced</text>
<rect class="slot" x="604" y="262" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="285">4 placeholders</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">The result is audited</text>
<text class="sub" x="96" y="360">contract rules, GP-SIGN and more</text>
<rect class="slot" x="604" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="349">audit</text>
<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="404">Any finding: nothing published</text>
<text class="sub" x="96" y="424">the command stops, no repo</text>
<path class="fail" d="M610 408H460"/>
<text class="label t-warn" x="476" y="398">no publish</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">The repo is published</text>
<text class="sub" x="96" y="488">git init, one commit, a remote</text>
<rect class="slot" x="604" y="454" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="477">git init, push</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">Commit events are posted</text>
<text class="sub" x="96" y="552">one commit event per commit</text>
<path class="async" d="M610 536H930"/>
<text class="label t-accent" x="786" y="526">POST /events</text>
<path class="async" d="M930 536H1088"/>
<text class="label t-accent" x="946" y="526">insert</text>
<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="596">The pipeline runs</text>
<text class="sub" x="96" y="616">lint to deploy, each step timed</text>
<path class="sync" d="M610 600H770"/>
<text class="label t-accent" x="626" y="590">7 make steps</text>
<path class="async" d="M770 600H930"/>
<text class="label t-accent" x="786" y="590">deploy event</text>
<circle class="dot-g" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="660">The stopwatch prints</text>
<text class="sub" x="96" y="680">command to production, timed</text>
<rect class="slot" x="604" y="646" width="12" height="36" rx="4"/>
<rect class="win" x="630" y="644" width="134" height="40" rx="10"/>
<text class="label b t-good" x="646" y="669">orders: 83 s</text>
<circle class="dot-w" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">8</text>
<text class="label b t-warn" x="96" y="724">An unsigned image is refused</text>
<text class="sub" x="96" y="744">no signatures found: failed event</text>
<path class="fail" d="M770 728H930"/>
<text class="label t-warn" x="786" y="718">failed event</text>
<circle class="dot" cx="66" cy="792" r="15"/><text class="num" x="66" y="797" text-anchor="middle">9</text>
<text class="label b t-ink" x="96" y="788">Metrics are computed</text>
<text class="sub" x="96" y="808">four numbers, per service, week</text>
<path class="read" d="M1088 792H460"/>
<text class="label" x="946" y="782">four metrics</text>
<path class="sync" d="M48 856H112"/><text class="legend" x="124" y="861">sync call</text>
<path class="async" d="M264 856H328"/><text class="legend" x="340" y="861">async message</text>
<path class="read" d="M520 856H584"/><text class="legend" x="596" y="861">read</text>
<path class="fail" d="M696 856H760"/><text class="legend" x="772" y="861">failure path</text>
</svg>
