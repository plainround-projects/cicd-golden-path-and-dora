<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="t d">
<title id="t">A golden path that measures itself</title>
<desc id="d">A product team runs goldenpath new-service. The generator reads the template and its contract, runs the conformance audit and, only if nothing is found, registers the catalog entry and publishes the new service repo. The new service repo runs the secure pipeline: lint, test, image, sign, attest, verify. The signed digest goes to the delivery path, which verifies it again before it deploys. The pipeline sends commit events and the delivery path sends deploy and failed events to the collector, which stores them in the event store on PostgreSQL. The DORA metrics read the store, and a simulation of a month writes into it. An unsigned image is refused by the delivery path and recorded as a failed event, drawn as a warning path.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="1039" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="1038" rx="16"/>
<text class="title" x="48" y="68">A golden path that measures itself</text>
<text class="caption" x="48" y="100">The contract is checked by code twice, and every number comes from events. Amber: the unsigned image is refused.</text>
<rect class="actor" x="48" y="196" width="168" height="72" rx="36"/>
<text class="name" x="132" y="228" text-anchor="middle">Product team</text>
<text class="sub" x="132" y="250" text-anchor="middle">goldenpath CLI</text>
<rect class="svc" x="256" y="184" width="296" height="112" rx="12"/>
<text class="name" x="272" y="216">Generator</text>
<text class="sub" x="272" y="240">goldenpath new-service</text>
<text class="sub" x="272" y="262">render, audit, publish</text>
<rect class="svc" x="648" y="184" width="224" height="96" rx="12"/>
<text class="name" x="664" y="216">New service repo</text>
<text class="sub" x="664" y="240">skeleton, workflow,</text>
<text class="sub" x="664" y="262">scripts</text>
<rect class="svc" x="920" y="184" width="232" height="112" rx="12"/>
<text class="name" x="936" y="216">Secure pipeline</text>
<text class="sub" x="936" y="240">lint, test, image,</text>
<text class="sub" x="936" y="262">sign, attest, verify</text>
<path class="store" d="M48 352a106 12 0 0 1 212 0v76a106 12 0 0 1 -212 0z"/>
<path class="rim" d="M48 352a106 12 0 0 0 212 0"/>
<text class="name" x="154" y="384" text-anchor="middle">Template</text>
<text class="sub" x="154" y="406" text-anchor="middle">template/ + contract</text>
<rect class="svc" x="256" y="380" width="240" height="96" rx="12"/>
<text class="name" x="272" y="412">Conformance audit</text>
<text class="sub" x="272" y="436">contract as code</text>
<text class="sub" x="272" y="458">a finding stops it</text>
<path class="store" d="M520 392a100 12 0 0 1 200 0v76a100 12 0 0 1 -200 0z"/>
<path class="rim" d="M520 392a100 12 0 0 0 200 0"/>
<text class="name" x="620" y="424" text-anchor="middle">Catalog entry</text>
<text class="sub" x="620" y="446" text-anchor="middle">owner = a team</text>
<rect class="svc" x="920" y="360" width="232" height="96" rx="12"/>
<text class="name" x="936" y="392">Delivery path</text>
<text class="sub" x="936" y="416">verify, then deploy</text>
<rect class="svc" x="920" y="520" width="232" height="96" rx="12"/>
<text class="name" x="936" y="552">Collector</text>
<text class="sub" x="936" y="576">POST /events</text>
<text class="sub" x="936" y="598">bearer token</text>
<path class="store" d="M928 712a112 12 0 0 1 224 0v76a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M928 712a112 12 0 0 0 224 0"/>
<text class="name" x="1040" y="744" text-anchor="middle">Event store</text>
<text class="sub" x="1040" y="766" text-anchor="middle">PostgreSQL</text>
<rect class="svc" x="640" y="700" width="232" height="96" rx="12"/>
<text class="name" x="656" y="732">DORA metrics</text>
<text class="sub" x="656" y="756">per service, per week</text>
<rect class="svc" x="928" y="860" width="224" height="96" rx="12"/>
<text class="name" x="944" y="892">Simulation</text>
<text class="sub" x="944" y="916">a month, three teams</text>
<rect class="note" x="640" y="520" width="216" height="142" rx="10"/>
<text class="label b t-warn" x="656" y="550">make demo-unsigned</text>
<text class="sub" x="656" y="576">unsigned image:</text>
<text class="sub" x="656" y="598">deploy.sh refuses,</text>
<text class="sub" x="656" y="620">failed event, detail</text>
<text class="sub" x="656" y="642">signature</text>
<path class="sync" d="M216 232H256"/>
<path class="sync" d="M552 232H648"/>
<text class="label t-accent" x="560" y="222">creates</text>
<path class="sync" d="M872 232H920"/>
