<path class="sync" d="M1036 616V700"/>
<path class="read" d="M928 748H872"/>
<path class="sync" d="M1040 860V800"/>
<path class="sync" d="M48 996H112"/><text class="legend" x="124" y="1001">sync call</text>
<path class="async" d="M264 996H328"/><text class="legend" x="340" y="1001">async message</text>
<path class="read" d="M520 996H584"/><text class="legend" x="596" y="1001">read</text>
<path class="fail" d="M696 996H760"/><text class="legend" x="772" y="1001">failure path</text>
</svg>
